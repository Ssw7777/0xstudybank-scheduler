name: Production data refresh

on:
  schedule:
    # Six-hour watchdog only. Each completed run dispatches the next ten-minute cycle.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  rolling-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write
      actions: write
    env:
      OIDC_AUDIENCE: https://0xstudybank.vercel.app
      FAST_URL: https://0xstudybank.vercel.app/api/cron/refresh?mode=fast
      WALLET_BATCH_URL: "https://0xstudybank.vercel.app/api/cron/refresh?mode=wallet-batch&walletBudget=5"
      STATUS_URL: https://0xstudybank.vercel.app/api/status
      BATCH_COUNT: "5"
      BATCH_INTERVAL_SECONDS: "135"
    steps:
      - name: Refresh exchanges, snapshot, and rolling wallet batches
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          get_oidc_token() {
            local encoded_audience
            encoded_audience="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$OIDC_AUDIENCE")"
            curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" \
              | node -e '
                  let input = "";
                  process.stdin.setEncoding("utf8");
                  process.stdin.on("data", (chunk) => { input += chunk; });
                  process.stdin.on("end", () => {
                    const value = JSON.parse(input).value;
                    if (typeof value !== "string" || !value) process.exit(1);
                    process.stdout.write(value);
                  });
                '
          }

          call_refresh() {
            local url="$1"
            local label="$2"
            local request_key="$3"
            local token body_file http_code
            body_file="$work_dir/${label}.json"
            token="$(get_oidc_token)"
            echo "::add-mask::$token"

            http_code="$(curl --silent --show-error --max-time 55 \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "X-Idempotency-Key: ${request_key}" \
              -H "Content-Type: application/json" \
              -o "$body_file" \
              -w '%{http_code}' \
              "$url" || true)"

            if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::warning title=${label}::Refresh endpoint returned HTTP ${http_code:-000}; the next rolling cycle will retry naturally."
              return 1
            fi

            LABEL="$label" BODY_FILE="$body_file" node <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.env.BODY_FILE, "utf8"));
          const isWalletBatch = process.env.LABEL.startsWith("wallet-batch-");
          const skipped = payload.skipped === "refresh_in_progress" || payload.reason === "refresh_in_progress";
          const batchWorked = !isWalletBatch || (Number(payload.batchAttempted) > 0 && Number(payload.batchSucceeded) > 0);
          const accepted = payload.ok === true && !skipped && batchWorked;
          if (!accepted) process.exit(1);
          const state = payload.refreshStatus || "accepted";
          console.log(`${process.env.LABEL}: ${state}`);
          NODE
          }

          fast_failed=0
          if ! call_refresh "$FAST_URL" "fast-start" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fast-start"; then
            fast_failed=$((fast_failed + 1))
          fi

          failed_batches=0
          batch_start="$(date +%s)"
          for batch in $(seq 1 "$BATCH_COUNT"); do
            target_time=$((batch_start + (batch - 1) * BATCH_INTERVAL_SECONDS))
            now="$(date +%s)"
            if (( target_time > now )); then
              sleep $((target_time - now))
            fi
            if (( batch == 3 )); then
              if ! call_refresh "$FAST_URL" "fast-mid" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fast-mid"; then
                fast_failed=$((fast_failed + 1))
              fi
            fi
            if ! call_refresh "$WALLET_BATCH_URL" "wallet-batch-${batch}" \
              "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-wallet-${batch}"; then
              failed_batches=$((failed_batches + 1))
            fi
          done

          status_token="$(get_oidc_token)"
          echo "::add-mask::$status_token"
          status_file="$work_dir/status.json"
          status_code="$(curl --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${status_token}" \
            -o "$status_file" \
            -w '%{http_code}' \
            "$STATUS_URL" || true)"

          if [[ ! "$status_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error title=Production status::Status endpoint returned HTTP ${status_code:-000}."
            exit 1
          fi

          BODY_FILE="$status_file" node <<'NODE'
          const fs = require("fs");
          const status = JSON.parse(fs.readFileSync(process.env.BODY_FILE, "utf8"));
          if (status.ok !== true || !Number.isFinite(status.refreshAgeSeconds) || status.refreshAgeSeconds > 900) {
            process.exit(1);
          }
          if (!Number.isInteger(status.snapshotCount) || status.snapshotCount < 1) process.exit(1);
          const walletCount = Number(status.walletCount) || 0;
          const walletsLive = Number(status.walletsLive) || 0;
          const walletsStale = Number(status.walletsStale) || 0;
          if (walletCount > 0 && walletsLive < Math.ceil(walletCount * 0.6)) {
            console.log(`::error title=Wallet freshness::Only ${walletsLive}/${walletCount} wallets are fresh within ten minutes.`);
            process.exit(1);
          }
          if (walletsStale > Math.max(2, Math.floor(walletCount * 0.1))) {
            console.log(`::error title=Wallet staleness::${walletsStale}/${walletCount} wallets exceed the three-hour freshness target.`);
            process.exit(1);
          }
          if (walletsStale > 0) {
            console.log(`::warning title=Wallet freshness::${status.walletsStale} wallet(s) still exceed the three-hour freshness target; rolling batches will continue.`);
          }
          console.log("Production status: healthy and recently refreshed.");
          NODE

          if (( fast_failed > 0 )); then
            echo "::error title=Fast refresh::${fast_failed}/2 exchange/snapshot refreshes failed."
            exit 1
          fi
          if (( failed_batches > 2 )); then
            echo "::error title=Wallet batches::${failed_batches}/${BATCH_COUNT} wallet batches failed."
            exit 1
          fi
          if (( failed_batches > 0 )); then
            echo "::warning title=Wallet batches::${failed_batches}/${BATCH_COUNT} wallet batches failed; later cycles will fill the gap."
          fi

          echo "Rolling refresh completed."

      - name: Queue the next rolling cycle
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          set +x
          curl --fail --silent --show-error --max-time 20 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            -o /dev/null \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-refresh.yml/dispatches"
          echo "Next rolling cycle queued."
