name: Production data refresh

on:
  schedule:
    # Wallet/Rabby round every ten minutes.
    - cron: "3,13,23,33,43,53 * * * *"
    # Interleaved CEX + portfolio snapshot round. Together both schedules keep
    # fast data on a five-minute cadence without doubling Rabby traffic.
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch:
    inputs:
      wallet_only:
        description: Skip exchange refresh when the cloud scheduler already refreshed it
        type: boolean
        default: false

permissions: {}

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

env:
  OIDC_AUDIENCE: https://0xstudybank.vercel.app
  FAST_URL: https://0xstudybank.vercel.app/api/cron/refresh?mode=fast
  TARGETS_URL: https://0xstudybank.vercel.app/api/cron/wallet-targets
  OBSERVATION_URL: https://0xstudybank.vercel.app/api/cron/wallet-observation
  STATUS_URL: https://0xstudybank.vercel.app/api/status
  RABBY_TOTAL_URL: https://api.rabby.io/v1/user/total_balance
  RABBY_PROTOCOL_URL: https://api.rabby.io/v1/user/complex_protocol_list
  RABBY_TOKEN_URL: https://api.rabby.io/v1/user/token_list
  RABBY_SPECIFIC_TOKEN_URL: https://api.rabby.io/v1/user/specific_token_list
  SHARD_COUNT: "5"
  RABBY_CALL_INTERVAL_SECONDS: "4"
  BATCH_STAGGER_SECONDS: "5"

jobs:
  fast-refresh:
    name: fast-refresh
    if: ${{ inputs.wallet_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Record exchange data and portfolio snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          response_file="$work_dir/fast-response.json"
          encoded_audience="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$OIDC_AUDIENCE")"
          token="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" \
            | node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => process.stdout.write(JSON.parse(input).value || ""));
              ')"
          test -n "$token"
          echo "::add-mask::$token"
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-delay 4 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "X-Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fast" \
            -H "Content-Type: application/json" \
            -o "$response_file" \
            -w '%{http_code}' \
            "$FAST_URL" || true)"
          if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error title=Fast refresh::Fast endpoint returned HTTP ${code:-000}."
            exit 1
          fi
          if ! RESPONSE_FILE="$response_file" node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE, "utf8"));
            if (body.ok !== true || body.reason === "refresh_in_progress") process.exit(1);
            console.log("Fast data refresh and snapshot accepted.");
          '; then
            echo "::error title=Fast refresh::Fast endpoint did not confirm a completed refresh."
            exit 1
          fi

  refresh-wallets:
    name: primary-shard-${{ matrix.shard }}
    needs: fast-refresh
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '3,13,23,33,43,53 * * * *') }}
    runs-on: ubuntu-latest
    # Includes the bounded collection budget and write retries; normal completion
    # does not wait for this limit.
    timeout-minutes: 10
    strategy:
      # A provider 429 fails the shard and cancels queued shards rather than
      # continuing from a different runner/IP.
      fail-fast: true
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4]
    permissions:
      contents: read
      id-token: write
    env:
      SHARD: ${{ matrix.shard }}
      MODE: primary
    steps:
      - uses: actions/checkout@v4
      - name: Collect and submit primary wallet shard
        shell: bash
        run: bash .github/scripts/refresh-wallet-shard.sh

  retry-stale-wallets:
    name: retry-shard-${{ matrix.shard }}
    needs: refresh-wallets
    if: ${{ always() && needs.refresh-wallets.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '3,13,23,33,43,53 * * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4]
    permissions:
      contents: read
      id-token: write
    env:
      SHARD: ${{ matrix.shard }}
      MODE: retry
    steps:
      - uses: actions/checkout@v4
      - name: Retry transient failures only when no provider rate limit occurred
        shell: bash
        run: bash .github/scripts/refresh-wallet-shard.sh

  finalize:
    name: verify-production-freshness
    needs: [fast-refresh, refresh-wallets, retry-stale-wallets]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '3,13,23,33,43,53 * * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Require all 25 wallets to be fresh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          status_file="$work_dir/status.json"
          targets_file="$work_dir/targets.json"

          encoded_audience="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$OIDC_AUDIENCE")"
          token="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" \
            | node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => process.stdout.write(JSON.parse(input).value || ""));
              ')"
          test -n "$token"
          echo "::add-mask::$token"

          for endpoint in status targets; do
            if [[ "$endpoint" == "status" ]]; then
              url="$STATUS_URL"
              output="$status_file"
            else
              url="$TARGETS_URL"
              output="$targets_file"
            fi
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-delay 4 --retry-all-errors \
              -H "Authorization: Bearer ${token}" \
              -o "$output" \
              -w '%{http_code}' \
              "$url" || true)"
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error title=Production verification::${endpoint} endpoint returned HTTP ${code:-000}."
              exit 1
            fi
          done

          STATUS_FILE="$status_file" TARGETS_FILE="$targets_file" node <<'NODE'
          const fs = require("fs");
          const status = JSON.parse(fs.readFileSync(process.env.STATUS_FILE, "utf8"));
          const targets = JSON.parse(fs.readFileSync(process.env.TARGETS_FILE, "utf8"));
          const failures = [];
          if (status.ok !== true) failures.push("status endpoint did not report ok");
          if (!Number.isFinite(status.refreshAgeSeconds) || status.refreshAgeSeconds > 600) {
            failures.push(`latest snapshot is ${status.refreshAgeSeconds ?? "unknown"} seconds old`);
          }
          if (!Number.isInteger(status.snapshotCount) || status.snapshotCount < 1) failures.push("no portfolio snapshot exists");
          if (Number(status.walletCount) !== 25) failures.push(`configured wallet count is ${status.walletCount}, expected 25`);
          if (Number(status.walletsLive) !== 25) failures.push(`only ${status.walletsLive}/25 wallets are live`);
          if (Number(status.walletsOver20min) !== 0) failures.push(`${status.walletsOver20min} wallets exceed 20 minutes`);
          if (Number(status.appsFresh) !== 25 || Number(status.appsStale) !== 0) {
            failures.push(`only ${status.appsFresh}/25 App audits are fresh`);
          }
          if (Number(status.protocolsFresh) !== 25 || Number(status.protocolsStale) !== 0) {
            failures.push(`only ${status.protocolsFresh}/25 protocol audits are fresh`);
          }
          if (targets.ok !== true || !Array.isArray(targets.wallets) || targets.wallets.length !== 25) {
            failures.push("wallet manifest is not exactly 25 addresses");
          } else {
            const retryCount = targets.wallets.filter((wallet) => wallet.needsRetry === true).length;
            if (retryCount !== 0) failures.push(`${retryCount} wallets remain older than the retry threshold`);
          }
          const audit = status.tokenAudit;
          const tokenWarnings = [];
          if (!audit || typeof audit !== "object") {
            tokenWarnings.push("token audit status unavailable; token quantities are not verified");
          } else {
            if (Number(audit.freshWallets) !== Number(status.walletCount)) {
              tokenWarnings.push(`only ${audit.freshWallets ?? "unknown"}/${status.walletCount} wallets have fresh token quantities`);
            }
            for (const field of ["staleWallets", "failedWallets", "missingWallets", "invalidRows", "duplicateRows", "aggregateMismatches"]) {
              if (!Number.isInteger(audit[field]) || audit[field] !== 0) tokenWarnings.push(`token ${field}: ${audit[field] ?? "unknown"}`);
            }
            if (audit.healthy !== true && tokenWarnings.length === 0) tokenWarnings.push("token audit is not healthy");
          }
          for (const warning of tokenWarnings) console.log(`::warning title=Token quantity audit::${warning}.`);
          if (failures.length) {
            for (const failure of failures) console.log(`::error title=Production freshness::${failure}.`);
            process.exit(1);
          }
          console.log("Balance freshness verified: snapshot current, 25/25 wallet totals, App audits, and protocol audits fresh.");
          console.log(tokenWarnings.length
            ? "Token audit remains incomplete; older quantities are explicitly flagged and their per-chain queue continues next round."
            : "Token audit verified: every configured wallet is fresh, with no invalid rows, duplicate rows, or aggregation mismatches.");
          NODE
