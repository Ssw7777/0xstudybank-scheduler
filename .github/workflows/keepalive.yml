name: Keep scheduled workflows active

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduler-keepalive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out scheduler repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record monthly scheduler heartbeat
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'Last scheduler heartbeat: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .scheduler-heartbeat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .scheduler-heartbeat
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: keep scheduled workflows active [skip ci]'
          git push
